[package]
name = "codegen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Regenerates sdk/src/generated from the vendored proto. Run with: cargo run -p codegen"

[dependencies]
prost-build = "0.14"
tonic-prost-build = "0.14"
pbjson-build = "0.9"
tempfile = "3"
# The rewrite of the generated messages (src/messages.rs): prost-build's own
# parser and formatter.
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
prettyplease = "0.3"
