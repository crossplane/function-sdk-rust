name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.2.0 (must match sdk/Cargo.toml)"
        required: true
        type: string
      message:
        description: 'Tag message'
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Verify input matches package version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          pkg_version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name=="function-sdk-rust") | .version')
          if [ "v$pkg_version" != "$INPUT_VERSION" ]; then
            echo "Input version $INPUT_VERSION does not match sdk/Cargo.toml version $pkg_version" >&2
            exit 1
          fi

      - name: Dry-run package build
        run: cargo publish -p function-sdk-rust --dry-run

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        run: cargo publish -p function-sdk-rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ inputs.version }}
          generate_release_notes: true
